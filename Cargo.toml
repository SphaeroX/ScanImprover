[package]
name = "ScanImprover"
version = "0.5.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["3d", "png", "bevy_log"] }
bevy_egui = { version = "0.42.0", default-features = false, features = ["render", "default_fonts", "manage_clipboard", "open_url"] }
egui = "0.36.2"
glam = "0.32"
rayon = "1.12.0"
rfd = "0.17.2"

[build-dependencies]
cc = "1.4.5"

# Bevy is unusably slow in unoptimised debug builds; keep dependencies
# optimised while the application itself stays debuggable.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
